<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Masuk atau daftar untuk melihat dan melacak pesanan VOLONTÀ.">
  <title>Akun & Pesanan — VOLONTÀ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="account.css?v=qris-20261108">
</head>
<body>
  <header><a class="wordmark" href="index.html">VOLONTÀ</a><a class="back-link" href="index.html">← Kembali ke toko</a></header>
  <main>
    <section class="auth-panel" id="auth-panel"><p class="eyebrow">VOLONTÀ / CUSTOMER ACCOUNT</p><div class="auth-heading"><h1 id="form-title">Masuk ke akun</h1><p id="form-intro" class="intro">Masuk untuk checkout dan melihat status pesananmu.</p></div>
      <div class="auth-mode-switch" aria-label="Pilih masuk atau daftar"><button id="login-tab" type="button" aria-pressed="true">Masuk</button><button id="signup-tab" type="button" aria-pressed="false">Daftar akun</button></div>
      <form id="account-form"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required><label for="password">Kata sandi</label><input id="password" name="password" type="password" minlength="6" autocomplete="current-password" required><button id="submit-button" type="submit">MASUK</button><p class="message" id="form-message" role="status" aria-live="polite"></p></form>
    </section>
    <section class="orders-panel" id="orders-panel" hidden><div class="orders-heading"><div><p class="eyebrow">VOLONTÀ / CUSTOMER ACCOUNT</p><h1>Pesanan saya</h1><p id="account-email" class="intro"></p></div><button id="logout-button" class="secondary-button">Keluar</button></div><p class="message" id="orders-message" role="status" aria-live="polite"></p><div id="orders-list" class="orders-list"></div></section>
  </main>
  <script src="supabase-config.js"></script><script src="auth.js"></script><script src="account.js?v=qris-20261108"></script>
</body>
</html>
